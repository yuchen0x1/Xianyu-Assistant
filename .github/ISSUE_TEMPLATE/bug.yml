name: 问题报告
description: 报告功能异常或回归。
body:
  - type: input
    id: version
    attributes:
      label: 控制台版本和部署方式
      placeholder: v3.5.28 / JAR / Windows 11 / Edge
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 操作步骤、预期结果和实际结果
      description: 请使用测试数据。提交前移除 Cookie、Token、卡密和个人信息。
    validations:
      required: true
