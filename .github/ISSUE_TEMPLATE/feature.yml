name: 功能建议
description: 描述希望改进的卖家操作流程。
body:
  - type: textarea
    id: workflow
    attributes:
      label: 当前流程与遇到的问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 说明在哪些部署方式或浏览器上使用，以及可接受的替代方案。
    validations:
      required: true
