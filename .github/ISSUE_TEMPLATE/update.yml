name: 更新失败
description: 报告更新检测、下载、校验、替换或重启问题。
body:
  - type: input
    id: versions
    attributes:
      label: 当前版本、目标版本和部署方式
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 失败阶段
      options: [检查更新, 下载, 校验, 替换, 重启, 版本回退, 其他]
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 错误提示与当前服务状态
      description: 标明是否仍能访问旧版本。请移除凭据、卡密和个人信息。
    validations:
      required: true
