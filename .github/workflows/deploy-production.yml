name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianyu-production
  cancel-in-progress: false

jobs:
  verify-build-deploy:
    name: Verify, build and deploy
    runs-on: [self-hosted, Linux, X64, xianyu-production]
    timeout-minutes: 40
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Verify production toolchain
        shell: bash
        run: |
          java -version
          node --version | grep -q '^v22\.12\.0$'
          npm --version

      - name: Test and build frontend
        working-directory: vue-code
        run: |
          npm ci
          npm test -- --run
          npm run type-check
          npm run build
          # 前端构建产物不入库（见 .gitignore），此处仅校验构建确实产出
          test -f ../src/main/resources/static/index.html
          test -d ../src/main/resources/static/assets

      - name: Test and package application
        id: package
        shell: bash
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean package
          version="$(./mvnw --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)"
          jar="target/XianYuSellerConsole-${version}.jar"
          test -f "$jar"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          install -m 0644 "$jar" /opt/xianyu-assistant/incoming/deploy.jar

      - name: Activate release with backup and rollback
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: sudo -n /usr/local/sbin/deploy-xianyu-assistant "$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Verify production endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            http://127.0.0.1:12400/actuator/health | grep -q '"status":"UP"'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --output /dev/null http://127.0.0.1:8080/
