name: Release

# 构建并发布到 GitHub Release（唯一发布源）。
# 需要 GitHub Actions Secrets 配置：
#   RELEASE_SIGN_PRIVATE_KEY    发布物 Ed25519 签名私钥（PKCS#8 DER Base64）
#                               scripts/sign-release.sh gen-key 生成，官方渠道必须配置。
# GITHUB_TOKEN 由 GitHub Actions 自动注入，无需另建 Secret。
on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to GitHub Release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: vue-code/package-lock.json

      - name: Verify tag format
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the vMAJOR.MINOR.PATCH format"
            exit 1
          fi

      - name: Build and publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_PRIVATE_KEY }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/publish-github.sh "$version"
