name: Maintenance

on:
  schedule:
    - cron: '21 3 4 * *'
  workflow_dispatch:
    inputs:
      previous_tag:
        description: 'Optional stable tag to upgrade to the currently published version'
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Verify published download links
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check stable assets and update metadata
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json
          tag=$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' release.json)
          jar="XianYuSellerConsole-${tag#v}.jar"
          for name in "$jar" "$jar.sha256" "$jar.sig" update-manifest.json update-manifest.json.sig; do
            url=$(jq -er --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded" and .size > 0) | .browser_download_url' release.json)
            curl --proto '=https' --head --location --fail --silent --show-error --max-time 30 "$url" > /dev/null
            printf -- '- `%s` · reachable\n' "$name" >> "$GITHUB_STEP_SUMMARY"
          done
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'update-manifest.json'
          digest=$(jq -er --arg jar "$jar" '.assets[] | select(.name == $jar) | .digest | sub("^sha256:"; "")' release.json)
          jq -e --arg tag "$tag" --arg jar "$jar" --arg digest "$digest" \
            '.schemaVersion == 1 and .tag == $tag and .jar.name == $jar and .jar.sha256 == $digest' update-manifest.json

  references:
    name: Track upstream releases
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Snapshot projects relevant to the roadmap
        run: |
          {
            printf '| Repository | Last push (UTC) | Latest release |\n| --- | --- | --- |\n'
            for repo in zhinianboke/xianyu-auto-reply 245867/xianyu-auto-delivery chatwoot/chatwoot medusajs/medusa louislam/dockge crazy-max/diun; do
              gh repo view "$repo" --json nameWithOwner,pushedAt,latestRelease,url \
                --jq '"| [\(.nameWithOwner)](\(.url)) | \(.pushedAt) | \(.latestRelease.tagName // "—") |"'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: Upgrade an isolated instance from GitHub Releases
    if: github.event_name == 'workflow_dispatch' && inputs.previous_tag != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Download signed baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${PREVIOUS_TAG#v}"
          jar="XianYuSellerConsole-$version.jar"
          gh release download "$PREVIOUS_TAG" --pattern "$jar" --pattern "$jar.sha256" --pattern "$jar.sig"
          sha256sum --check "$jar.sha256"
      - name: Verify update discovery, download, restart and persisted login
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: bash scripts/smoke-upgrade.sh "${PREVIOUS_TAG#v}"
