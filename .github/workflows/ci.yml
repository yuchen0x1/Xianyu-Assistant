name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Maven tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vue-code

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: vue-code/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npm run type-check

      - name: Build frontend
        run: npm run build

      - name: Verify committed frontend assets
        run: |
          # 前端构建产物不入库（见 .gitignore），此处仅校验构建确实产出
          test -f ../src/main/resources/static/index.html
          test -d ../src/main/resources/static/assets

  mobile:
    name: Flutter mobile checks
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Analyze mobile client
        run: flutter analyze --no-pub

      - name: Run mobile tests
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: flutter test --no-pub

      - name: Build Android debug package
        run: flutter build apk --debug --no-pub --android-skip-build-dependency-validation

  docker:
    name: Dockerfile check
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Docker build
        run: docker buildx build --check .

      - name: Build runtime image
        run: docker buildx build --load --tag xianyu-seller-console:ci .
