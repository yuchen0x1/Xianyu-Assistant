name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Maven tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vue-code

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: vue-code/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit runtime and build dependencies
        run: node ../scripts/audit-frontend.mjs

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        # 之前只在本地跑 lint，CI 不校验，导致 lint 规则实际可被长期违反
        run: npm run lint:check

      - name: Type-check and build frontend
        run: npm run build

      - name: Verify generated frontend assets
        run: |
          test -f ../src/main/resources/static/index.html
          test -d ../src/main/resources/static/assets
          test -z "$(find ../src/main/resources/static -name '*.map' -print -quit)"

      - name: Upload Web assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-assets
          path: src/main/resources/static/
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package Web service
    needs: [backend, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-assets
          path: src/main/resources/static/
      - run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-server-jar
          path: target/XianYuSellerConsole-*.jar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  jar-smoke:
    name: JAR smoke (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-server-jar
          path: target/
      - name: Boot the packaged application
        shell: bash
        run: |
          version=$(node -p "require('./vue-code/package.json').version")
          node scripts/smoke-jar.mjs "target/XianYuSellerConsole-$version.jar" "$version"

  docker:
    name: Dockerfile check
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Docker build
        run: docker buildx build --check .

      - name: Build runtime image
        run: docker compose build

      - name: Verify Compose boot and persisted state across recreation
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:12400/ | grep -o '/assets/[^" ]*\.js' > /dev/null
          docker compose exec -T console sh -c 'test -s dbdata/jwt-secret.key && touch dbdata/.ci-volume-check'
          docker compose up -d --no-build --force-recreate --wait --wait-timeout 120
          docker compose exec -T console test -f dbdata/.ci-volume-check

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color --tail 150

      - name: Remove CI containers and disposable volumes
        if: always()
        run: docker compose down --volumes

  required:
    name: Required checks
    if: always()
    needs: [backend, frontend, package, jar-smoke, docker]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
