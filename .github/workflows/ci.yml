name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Maven tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vue-code

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: vue-code/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        # 之前只在本地跑 lint，CI 不校验，导致 lint 规则实际可被长期违反
        run: npm run lint:check

      - name: Type-check frontend
        run: npm run type-check

      - name: Build frontend
        run: npm run build

      - name: Verify committed frontend assets
        run: |
          # 前端构建产物不入库（见 .gitignore），此处仅校验构建确实产出
          test -f ../src/main/resources/static/index.html
          test -d ../src/main/resources/static/assets

  docker:
    name: Dockerfile check
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Docker build
        run: docker buildx build --check .

      - name: Build runtime image
        run: docker buildx build --load --tag xianyu-seller-console:ci .
